<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bdd9ef">
<meta name="description" content="生日快乐，天如~">
<title>生日快乐，天如~</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='86'%3E🎂%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/MaokenAssortedSans-Lite.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="birthday.css?v=8"><script src="birthday.js?v=5" defer></script>
</head>
<body>
<main class="birthday-scene" aria-label="给天如的生日派对">
<div class="daylight" aria-hidden="true"></div>
<canvas id="clouds" aria-hidden="true"></canvas>
<div class="sky-ribbon ribbon-left" aria-hidden="true"><svg viewBox="0 0 100 140"><path d="M45-10C44 20 80 30 65 53S12 62 32 92s45 24 22 58" fill="none" stroke="currentColor" stroke-width="2"/><path d="M45-10C44 20 80 30 65 53S12 62 32 92s45 24 22 58" fill="none" stroke="#fff9" stroke-width=".7" transform="translate(2)"/></svg></div>
<div class="sky-ribbon ribbon-right" aria-hidden="true"><svg viewBox="0 0 100 140"><path d="M40-10Q70 15 40 40T40 90T40 150" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
<header class="scene-header"><span class="little-date">只给今天的寿星 ♡</span><button id="music-toggle" class="music-toggle" type="button" aria-label="播放生日歌" aria-pressed="false"><span class="music-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="music-label">生日歌</span></button></header>
<div class="birthday-message">
<div class="greeting">
<span class="greeting-spark left-spark" aria-hidden="true">✧</span>
<p class="birthday-small">Happy 21st Birthday</p>
<h1>生日快乐，天如~</h1>
<p class="birthday-line" id="birthday-line">新的一岁要天天开心呀！</p>
<span class="greeting-spark right-spark" aria-hidden="true">✦</span>
</div>
<div class="party-controls">
<button id="blow-candle" class="blow-button" type="button"><span id="blow-label">许好愿啦，吹蜡烛</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 7.2 2.8 9.4 10 10-7.2.6-9.4 2.8-10 10C11.4 14.8 9.2 12.6 2 12c7.2-.6 9.4-2.8 10-10Z" fill="currentColor"/></svg></button>
</div>
</div>
<div class="cake-stage" id="cake-stage" aria-label="插着三根蜡烛的粉色鲜花雕花小蛋糕">
<div class="cake-levitation">
<div class="cake-aura" aria-hidden="true"></div>
<img class="birthday-cake" src="cake-pink-floral.png" alt="玫瑰粉奶油、立体花朵和复古雕花裱花的小蛋糕" fetchpriority="high" draggable="false">
<div class="candles" aria-hidden="true">
<div class="candle-glow"></div>
<div class="candle-anchor candle-left"><span class="flame"><i></i></span><svg class="candle-smoke" viewBox="0 0 40 80"><path d="M20 76Q4 58 20 40T20 4"/></svg></div>
<div class="candle-anchor candle-middle"><span class="flame"><i></i></span><svg class="candle-smoke" viewBox="0 0 40 80"><path d="M20 76Q36 58 20 40T20 4"/></svg></div>
<div class="candle-anchor candle-right"><span class="flame"><i></i></span><svg class="candle-smoke" viewBox="0 0 40 80"><path d="M20 76Q4 58 20 40T20 4"/></svg></div>
</div>
<div class="cake-shadow" aria-hidden="true"></div>
</div>
</div>

<p class="touch-hint" id="touch-hint">在云里划一下，试试看 ✧</p>
<canvas id="stardust" aria-hidden="true"></canvas>
<div class="music-notice" role="status" id="music-notice"></div>
<div class="load-note" id="load-note" role="status">蛋糕马上就来…</div>
</main>
<audio id="birthday-audio" src="birthday-song.mp3" preload="metadata" loop></audio>
<noscript><p class="noscript-note">打开浏览器的 JavaScript，就能吹蜡烛啦。</p></noscript>
</body></html>
